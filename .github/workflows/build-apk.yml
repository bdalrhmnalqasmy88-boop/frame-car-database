name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Organize Files if Subfolder Exists
        run: |
          if [ -d "frame-car-database" ] && [ -f "frame-car-database/package.json" ]; then
            cp -r frame-car-database/* .
            rm -rf frame-car-database
          fi

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Inject Package directly to Expo Config
        run: |
          node -e '
            const fs = require("fs");
            let file = fs.existsSync("app.json") ? "app.json" : null;
            if (file) {
              let config = JSON.parse(fs.readFileSync(file, "utf8"));
              if (!config.expo) config.expo = {};
              config.expo.android = { package: "com.framedb.app" };
              fs.writeFileSync(file, JSON.stringify(config, null, 2));
            }
          '

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build APK via EAS Local
        env:
          EAS_NO_VCS: "1"
        run: |
          eas build --platform android --profile preview --local --non-interactive || {
            rm -rf android
            npx expo prebuild --platform android
            cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-app-apk
          path: |
            *.apk
            android/app/build/outputs/apk/debug/app-debug.apk
