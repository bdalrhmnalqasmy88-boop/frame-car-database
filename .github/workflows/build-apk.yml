name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Force Package Name in app.json
        run: |
          node -e '
            const fs = require("fs");
            let file = "app.json";
            if (fs.existsSync(file)) {
              let config = JSON.parse(fs.readFileSync(file, "utf8"));
              if (!config.expo) config.expo = {};
              if (!config.expo.android) config.expo.android = {};
              config.expo.android.package = "com.framedb.app";
              fs.writeFileSync(file, JSON.stringify(config, null, 2));
            }
          '

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Android Project via Expo
        run: |
          rm -rf android
          npx expo prebuild --platform android --no-install

      - name: Hardcode Package Name in Android Manifest & Gradle
        run: |
          node -e '
            const fs = require("fs");
            const gPath = "android/app/build.gradle";
            if (fs.existsSync(gPath)) {
              let content = fs.readFileSync(gPath, "utf8");
              if (!content.includes("namespace")) {
                content = content.replace(/android\s*\{/, "android {\n    namespace \"com.framedb.app\"");
                fs.writeFileSync(gPath, content);
              }
            }
          '

      - name: Build APK File
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
