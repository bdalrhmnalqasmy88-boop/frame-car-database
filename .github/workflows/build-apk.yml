name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unzip Project Files
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Unzipping project file..."
            unzip -o *.zip
            if [ -d "project" ]; then
              cp -rn project/* . || true
            fi
          fi

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Fix Babel Config for Reanimated
        run: |
          if [ -f "babel.config.js" ]; then
            if ! grep -q "react-native-reanimated/plugin" babel.config.js; then
              echo "Adding reanimated plugin to babel.config.js..."
              sed -i 's/plugins: \[/plugins: \["react-native-reanimated\/plugin", /g' babel.config.js || true
            fi
          fi

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & Prebuild Expo
        run: |
          npx expo prebuild --platform android --clean || true

      - name: Build Android APK
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug -x lint -x test --continue || ./gradlew assembleDebug
          else
            echo "Android folder was not generated by Expo prebuild."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
