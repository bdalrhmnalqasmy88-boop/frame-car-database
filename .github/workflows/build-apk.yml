name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --no-save react-native-worklets@0.5.1 @react-native-community/cli @react-native-community/cli-platform-android

      - name: Verify Expo Config
        run: npx expo config --type public --json > /tmp/expo-config.json && node -e "const c=require('/tmp/expo-config.json'); if(!c.android||!c.android.package){throw new Error('android.package missing in app.json')} console.log('package:', c.android.package)"

      - name: Prebuild Android Project
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean --no-install

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
