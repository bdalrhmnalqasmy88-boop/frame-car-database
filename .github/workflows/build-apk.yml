name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Force Fix Package Name in app.json
        run: |
          node -e '
            const fs = require("fs");
            if (fs.existsSync("app.json")) {
              let data = JSON.parse(fs.readFileSync("app.json", "utf8"));
              if (!data.expo) data.expo = {};
              if (!data.expo.android) data.expo.android = {};
              data.expo.android.package = "com.framedb.app";
              fs.writeFileSync("app.json", JSON.stringify(data, null, 2));
              console.log("Package name injected successfully!");
            }
          '

      - name: Clean Old Native Android Directory
        run: |
          rm -rf android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Fresh Expo Prebuild
        env:
          NODE_ENV: production
          EXPO_USE_COMMUNITY_AUTOLINKING: "1"
        run: |
          npx expo prebuild --platform android --clean

      - name: Build APK with Gradle
        env:
          EXPO_USE_COMMUNITY_AUTOLINKING: "1"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
