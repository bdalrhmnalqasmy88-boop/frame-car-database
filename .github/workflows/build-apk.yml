name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Move Subfolder to Root if Exists
        run: |
          # إذا كانت ملفات المشروع داخل مجلد فرعي يتم نقلها للجذر مباشرة
          if [ -d "frame-car-database" ] && [ -f "frame-car-database/package.json" ]; then
            echo "Moving inner project files to root..."
            cp -r frame-car-database/* .
            rm -rf frame-car-database
          fi

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Force Fix app.json Package Name
        run: |
          node -e '
            const fs = require("fs");
            let file = "app.json";
            if (fs.existsSync(file)) {
              let config = JSON.parse(fs.readFileSync(file, "utf8"));
              if (!config.expo) config.expo = {};
              if (!config.expo.android) config.expo.android = {};
              config.expo.android.package = "com.framedb.app";
              fs.writeFileSync(file, JSON.stringify(config, null, 2));
              console.log("Updated app.json package name successfully!");
            }
          '

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Expo Prebuild
        env:
          NODE_ENV: production
          EXPO_USE_COMMUNITY_AUTOLINKING: "1"
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean

      - name: Build APK with Gradle
        env:
          EXPO_USE_COMMUNITY_AUTOLINKING: "1"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
