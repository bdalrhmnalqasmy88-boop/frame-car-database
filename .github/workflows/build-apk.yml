name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Inject Package Name to app.json & Remove Old Android Directory
        run: |
          # 1. إجبار إضافة package اسم الحزمة في app.json
          node -e '
            const fs = require("fs");
            let file = "app.json";
            if (fs.existsSync(file)) {
              let config = JSON.parse(fs.readFileSync(file, "utf8"));
              if (!config.expo) config.expo = {};
              if (!config.expo.android) config.expo.android = {};
              config.expo.android.package = "com.framedb.app";
              fs.writeFileSync(file, JSON.stringify(config, null, 2));
              console.log("SUCCESS: Package name inserted into app.json");
            }
          '
          # 2. حذف مجلد android النقال القديم لمنع التعارض
          rm -rf android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Expo Prebuild (Generate Fresh Android Project)
        env:
          NODE_ENV: production
          EXPO_USE_COMMUNITY_AUTOLINKING: "1"
        run: |
          npx expo prebuild --platform android --clean

      - name: Fix Package Name in Native Build Files
        run: |
          # التأكد من وجود packageName داخل build.gradle
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/namespace .*/namespace "com.framedb.app"/' android/app/build.gradle || true
          fi

      - name: Build APK with Gradle
        env:
          EXPO_USE_COMMUNITY_AUTOLINKING: "1"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
