name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Force Package Name in app.json
        run: |
          node -e '
            const fs = require("fs");
            let file = "app.json";
            if (fs.existsSync(file)) {
              let config = JSON.parse(fs.readFileSync(file, "utf8"));
              if (!config.expo) config.expo = {};
              if (!config.expo.android) config.expo.android = {};
              config.expo.android.package = "com.framedb.app";
              fs.writeFileSync(file, JSON.stringify(config, null, 2));
            }
          '

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Expo Prebuild
        env:
          NODE_ENV: production
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean

      - name: Build APK with Gradle
        env:
          NODE_ENV: production
          EXPO_USE_COMMUNITY_AUTOLINKING: "1"
          REACT_NATIVE_NODE_BINARY: /usr/local/bin/node
        run: |
          export PATH=$PATH:/usr/local/bin
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m" -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
